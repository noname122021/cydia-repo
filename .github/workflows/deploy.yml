name: Deploy Cydia Repo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/debs
          cp -r Packages Packages.bz2 Release CydiaIcon.png index.html README.md depictions _site/
          cp -f robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -f google*.html _site/ 2>/dev/null || true

      - name: Fetch deb packages from GitHub Releases
        run: |
          DICTAKEY_V100_URL="https://github.com/noname122021/dictakey/releases/download/v1.0.0"
          DICTAKEY_V101_URL="https://github.com/noname122021/dictakey/releases/download/v1.0.1"
          VIDEOCONTROLS_URL="https://github.com/noname122021/videocontrolsplus/releases/download/v1.0.3"
          PERFHUD_URL="https://github.com/noname122021/perfhud/releases/download/v1.1.1"

          grep "^Filename: debs/" Packages | awk '{print $2}' | while read -r deb_path; do
            deb_name=$(basename "$deb_path")
            echo "Fetching $deb_name..."
            if [[ "$deb_name" == *"videocontrolsplus"* ]]; then
              curl -sSL -f -o "_site/debs/$deb_name" "$VIDEOCONTROLS_URL/$deb_name"
            elif [[ "$deb_name" == *"perfhud"* ]]; then
              curl -sSL -f -o "_site/debs/$deb_name" "$PERFHUD_URL/$deb_name"
            elif [[ "$deb_name" == *"dictakey_1.0.1"* ]]; then
              curl -sSL -f -o "_site/debs/$deb_name" "$DICTAKEY_V101_URL/$deb_name"
            else
              curl -sSL -f -o "_site/debs/$deb_name" "$DICTAKEY_V100_URL/$deb_name"
            fi
          done
          echo "Downloaded debs:"
          ls -lh _site/debs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
