name: Deploy Cydia Repo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/debs
          cp -r Packages Packages.bz2 Release CydiaIcon.png index.html README.md _site/
          cp -f robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -f google*.html _site/ 2>/dev/null || true

      - name: Fetch deb packages from GitHub Releases
        run: |
          RELEASE_URL="https://github.com/noname122021/dictakey/releases/download/v1.0.0"
          grep "^Filename: debs/" Packages | awk '{print $2}' | while read -r deb_path; do
            deb_name=$(basename "$deb_path")
            echo "Fetching $deb_name..."
            curl -sSL -f -o "_site/debs/$deb_name" "$RELEASE_URL/$deb_name"
          done
          echo "Downloaded debs:"
          ls -lh _site/debs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
